modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT License"
issueTrackerURL = "${mod_issues}"
showAsResourcePack = false

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "${mod_homepage}"
logoFile = "logo.png"
authors = "${mod_author}"
description = "${mod_description}"

[[dependencies.${mod_id}]]
modId = "neoforge"
mandatory = true
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21,)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "shfa.mixins.json"
